name: Release
run-name: Onyx ${{ inputs.version || github.ref_name }} public DMG

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, with or without a leading v (for example, 0.1.2)"
        required: true
        type: string

# Public releases are deliberately ad-hoc development builds. No Apple
# signing key or notarization credential is exposed to this workflow.
permissions:
  contents: write

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release DMG
    runs-on: macos-15
    timeout-minutes: 70
    env:
      CLANG_MODULE_CACHE_PATH: ${{ github.workspace }}/.build/module-cache
      SWIFTPM_MODULECACHE_OVERRIDE: ${{ github.workspace }}/.build/swiftpm-module-cache

    steps:
      - name: Check out immutable source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify release automation contract
        shell: zsh -euo pipefail {0}
        run: scripts/check-release-automation.sh

      - name: Select compatible Xcode
        shell: zsh -euo pipefail {0}
        run: |
          developer_candidates=("$(/usr/bin/xcode-select -p)")
          xcode_apps=(/Applications/Xcode_*.app(NOn))
          for (( index=${#xcode_apps[@]}; index >= 1; index-- )); do
            developer_candidates+=("${xcode_apps[index]}/Contents/Developer")
          done

          selected_xcode=""
          for candidate in "${developer_candidates[@]}"; do
            export DEVELOPER_DIR="$candidate"
            if /usr/bin/swift package --disable-sandbox dump-package >/dev/null 2>&1; then
              selected_xcode="$candidate"
              break
            fi
          done
          if [[ -z "$selected_xcode" ]]; then
            print -u2 -- "The runner image does not contain Xcode 26 / Swift 6.2 or newer."
            exit 1
          fi
          echo "DEVELOPER_DIR=$selected_xcode" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$selected_xcode"
          /usr/bin/xcodebuild -version
          /usr/bin/swift --version

      - name: Resolve and lock release source
        id: metadata
        shell: zsh -euo pipefail {0}
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          main_sha="$(gh api \
            "repos/$GITHUB_REPOSITORY/branches/$DEFAULT_BRANCH" \
            --jq '.commit.sha')"
          [[ -n "$main_sha" ]] || {
            print -u2 -- "Could not resolve the current $DEFAULT_BRANCH head."
            exit 1
          }

          if [[ "$EVENT_NAME" == "push" ]]; then
            tag="$GITHUB_REF_NAME"
            version="${tag#v}"
            [[ "$tag" =~ '^v[0-9]+[.][0-9]+[.][0-9]+$' ]] || {
              print -u2 -- "Tag must be vX.Y.Z: $tag"
              exit 1
            }
            tag_commit="$(/usr/bin/git rev-parse "$tag^{commit}")"
            [[ "$tag_commit" == "$SOURCE_SHA" ]] || {
              print -u2 -- "Tag $tag does not point at $SOURCE_SHA (found $tag_commit)."
              exit 1
            }
            [[ "$main_sha" == "$SOURCE_SHA" ]] || {
              print -u2 -- "Release tag $tag is not the current $DEFAULT_BRANCH head."
              exit 1
            }
          else
            [[ "$SOURCE_REF" == "refs/heads/$DEFAULT_BRANCH" ]] || {
              print -u2 -- "Manual releases must run from $DEFAULT_BRANCH."
              exit 1
            }
            version="${REQUESTED_VERSION#v}"
            [[ "$version" =~ '^[0-9]+[.][0-9]+[.][0-9]+$' ]] || {
              print -u2 -- "Release version must be numeric x.y.z: $version"
              exit 1
            }
            tag="v$version"
            if /usr/bin/git ls-remote --exit-code origin "refs/tags/$tag" >/dev/null 2>&1; then
              existing_tag_commit="$(/usr/bin/git ls-remote origin "refs/tags/$tag^{}" | /usr/bin/awk '{print $1}')"
              if [[ -z "$existing_tag_commit" ]]; then
                existing_tag_commit="$(/usr/bin/git ls-remote origin "refs/tags/$tag" | /usr/bin/awk '{print $1}')"
              fi
              [[ "$existing_tag_commit" == "$SOURCE_SHA" ]] || {
                print -u2 -- "Release tag already exists at a different commit and will not be moved: $tag"
                exit 1
              }
            else
              [[ -n "$main_sha" && "$main_sha" == "$SOURCE_SHA" ]] || {
                print -u2 -- "The checked-out commit is not the current $DEFAULT_BRANCH head."
                exit 1
              }
            fi
          fi

          declared_version="$(/usr/bin/plutil -extract CFBundleShortVersionString raw -o - support/Info.plist)"
          [[ "$version" == "$declared_version" ]] || {
            print -u2 -- "Release $version does not match support/Info.plist ($declared_version)."
            exit 1
          }
          checked_out_sha="$(/usr/bin/git rev-parse HEAD)"
          [[ "$checked_out_sha" == "$SOURCE_SHA" ]] || {
            print -u2 -- "Checked-out source does not match the immutable workflow commit."
            exit 1
          }

          artifact_name="Onyx-$version-macOS"
          print "version=$version" >> "$GITHUB_OUTPUT"
          print "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          print "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        shell: zsh -euo pipefail {0}
        run: /usr/bin/swift test --disable-sandbox

      - name: Restore pinned Codex runtime archives
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: .artifacts/codex-runtime
          key: codex-runtime-${{ runner.os }}-${{ hashFiles('support/codex-runtime-manifest.json') }}

      - name: Fetch and verify pinned Codex runtime archives
        shell: zsh -euo pipefail {0}
        run: scripts/fetch-codex-runtime.sh --architectures universal

      - name: Build and verify ad-hoc release artifacts
        shell: zsh -euo pipefail {0}
        run: |
          release_dir="$RUNNER_TEMP/onyx-release"
          scripts/release.sh "${{ steps.metadata.outputs.version }}" "$release_dir" \
            --build-number "$GITHUB_RUN_NUMBER" \
            --source-revision "$GITHUB_SHA" \
            --display-name Onyx \
            --bundle-id app.onyx.agent \
            --architectures universal \
            --signing-identity - \
            --no-notarize
          (
            cd "$release_dir"
            /usr/bin/shasum -a 256 -c \
              "${{ steps.metadata.outputs.artifact_name }}.dmg.sha256"
          )

      - name: Create and verify public GitHub Release
        shell: zsh -euo pipefail {0}
        env:
          ARTIFACT_NAME: ${{ steps.metadata.outputs.artifact_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          TAG: ${{ steps.metadata.outputs.tag }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          release_dir="$RUNNER_TEMP/onyx-release"
          dmg_path="$release_dir/$ARTIFACT_NAME.dmg"
          checksum_path="$release_dir/$ARTIFACT_NAME.dmg.sha256"
          [[ -f "$dmg_path" && -f "$checksum_path" ]] || {
            print -u2 -- "Release DMG/checksum pair is incomplete."
            exit 1
          }

          # A release build can run for a long time. Revalidate the immutable
          # checkout before any publication work. The workflow intentionally
          # publishes only the current default-branch head; an exact existing
          # tag is reusable only when it still targets this same source.
          assert_clean_source() {
            local checked_out_sha
            checked_out_sha="$(/usr/bin/git rev-parse HEAD)"
            [[ "$checked_out_sha" == "$SOURCE_SHA" ]] || {
              print -u2 -- "Checked-out source changed during the release run."
              return 1
            }
            /usr/bin/git diff-index --quiet HEAD -- || {
              print -u2 -- "Tracked source changed during the release run."
              return 1
            }
            [[ -z "$(/usr/bin/git status --porcelain --untracked-files=all)" ]] || {
              print -u2 -- "The release checkout contains uncommitted or untracked source."
              return 1
            }
          }
          assert_current_main() {
            local current_main_sha
            assert_clean_source
            current_main_sha="$(gh api \
              "repos/$GITHUB_REPOSITORY/branches/$DEFAULT_BRANCH" \
              --jq '.commit.sha')"
            [[ "$current_main_sha" == "$SOURCE_SHA" ]] || {
              print -u2 -- "The release source is no longer the current $DEFAULT_BRANCH head."
              return 1
            }
          }
          assert_clean_source

          notes_file="$RUNNER_TEMP/onyx-release-notes.md"
          {
            print -- "Onyx $VERSION for macOS 15 or newer."
            print
            print -- "Download the universal DMG for Apple Silicon or Intel Macs, together with its SHA-256 checksum."
            print
            print -- "**Development distribution:** the app is ad-hoc signed and the DMG is not notarized. macOS will show the normal unidentified-developer warning."
            print
            print -- "Source commit: [$SOURCE_SHA]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$SOURCE_SHA)"
          } > "$notes_file"

          # Resolve a tag through the authenticated GitHub API instead of the
          # runner's eventually-consistent remote mirror. The commits endpoint
          # dereferences both lightweight and annotated tags. A newly-created
          # ref can take a moment to appear, so retry only this bounded read.
          resolve_tag_commit() {
            local tag_name="$1"
            local resolved=""
            local attempt
            for attempt in {1..6}; do
              resolved="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag_name" \
                --jq '.sha' 2>/dev/null || true)"
              if [[ -n "$resolved" ]]; then
                print -r -- "$resolved"
                return 0
              fi
              sleep "$attempt"
            done
            return 1
          }

          # A manual run may spend a long time building. Create its tag only
          # after the artifact is verified, using the GitHub ref API so a
          # concurrent tag creator gets an atomic conflict instead of silently
          # changing the release target. Existing exact tags are reusable for
          # a retry while this source remains the current branch head; tags at
          # another commit fail closed.
          tag_created_this_run=false
          if [[ "$EVENT_NAME" != "push" ]]; then
            existing_tag_commit="$(resolve_tag_commit "$TAG" || true)"
            if [[ -n "$existing_tag_commit" ]]; then
              [[ "$existing_tag_commit" == "$SOURCE_SHA" ]] || {
                print -u2 -- "Release tag $TAG already points at a different commit; refusing to move it."
                exit 1
              }
            else
              assert_current_main
              if ! gh api --method POST \
                  "repos/$GITHUB_REPOSITORY/git/refs" \
                  -f "ref=refs/tags/$TAG" \
                  -f "sha=$SOURCE_SHA" >/dev/null; then
                # A concurrent run may have won the create race. Continue only
                # when its immutable tag resolves to this exact source SHA.
                raced_tag_commit="$(resolve_tag_commit "$TAG" || true)"
                [[ "$raced_tag_commit" == "$SOURCE_SHA" ]] || {
                  print -u2 -- "Could not create release tag $TAG at $SOURCE_SHA; refusing to accept a different target."
                  exit 1
                }
              fi
              tag_created_this_run=true
            fi
          fi

          tag_commit="$(resolve_tag_commit "$TAG" || true)"
          [[ "$tag_commit" == "$SOURCE_SHA" ]] || {
            print -u2 -- "Release tag does not point at source commit $SOURCE_SHA."
            exit 1
          }

          # Re-read release state after the long build. A prior successful
          # publication can be safely verified on retry, while a different
          # release is never replaced.
          release_reused=false
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [[ "$tag_created_this_run" == "true" ]]; then
              assert_current_main
            fi
            if ! gh release create \
                "$TAG" "$dmg_path" "$checksum_path" \
                --repo "$GITHUB_REPOSITORY" \
                --title "Onyx $VERSION (development build)" \
                --notes-file "$notes_file" \
                --latest \
                --fail-on-no-commits \
                --verify-tag; then
              # Another exact-SHA run may have published while this build was
              # running. Never replace it; let the postconditions below decide
              # whether the existing public release is safe to reuse.
              gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || exit 1
              release_reused=true
            fi
          else
            release_reused=true
          fi

          release_json="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,assets,body,url)"
          [[ "$(print -r -- "$release_json" | /usr/bin/jq -r '.tagName')" == "$TAG" ]] || exit 1
          [[ "$(print -r -- "$release_json" | /usr/bin/jq -r '.isDraft')" == "false" ]] || exit 1
          [[ "$(print -r -- "$release_json" | /usr/bin/jq -r '.isPrerelease')" == "false" ]] || exit 1
          source_note="Source commit: [$SOURCE_SHA]"
          [[ "$(print -r -- "$release_json" | /usr/bin/jq -r '.body')" == *"$source_note"* ]] || {
            print -u2 -- "Release notes do not identify source commit $SOURCE_SHA."
            exit 1
          }
          latest_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')"
          [[ "$latest_tag" == "$TAG" ]] || {
            print -u2 -- "Published release was not selected as latest."
            exit 1
          }
          asset_count="$(print -r -- "$release_json" | /usr/bin/jq '.assets | length')"
          [[ "$asset_count" == "2" ]] || {
            print -u2 -- "Release must contain exactly two assets."
            exit 1
          }
          print -r -- "$release_json" | /usr/bin/jq -e \
            --arg dmg "$ARTIFACT_NAME.dmg" \
            --arg checksum "$ARTIFACT_NAME.dmg.sha256" \
            '([.assets[].name] | sort) == ([$dmg, $checksum] | sort)' >/dev/null

          if [[ "$release_reused" == "true" ]]; then
            # A retry has a different GitHub run number and therefore may have
            # a different local DMG byte-for-byte. Reuse only the immutable
            # public pair after downloading it into a fresh directory,
            # checking its checksum file, and matching GitHub's asset digests.
            existing_release_dir="$(/usr/bin/mktemp -d "$RUNNER_TEMP/onyx-existing-release.XXXXXX")"
            gh release download "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$ARTIFACT_NAME.dmg" \
              --pattern "$ARTIFACT_NAME.dmg.sha256" \
              --dir "$existing_release_dir"
            existing_dmg="$existing_release_dir/$ARTIFACT_NAME.dmg"
            existing_checksum="$existing_release_dir/$ARTIFACT_NAME.dmg.sha256"
            [[ -f "$existing_dmg" && ! -L "$existing_dmg" && \
               -f "$existing_checksum" && ! -L "$existing_checksum" ]] || {
              print -u2 -- "Existing release assets could not be downloaded as regular files."
              exit 1
            }
            (
              cd "$existing_release_dir"
              /usr/bin/shasum -a 256 -c "$existing_checksum"
            )
            for asset_path in "$existing_dmg" "$existing_checksum"; do
              asset_name="${asset_path:t}"
              local_digest="$(/usr/bin/shasum -a 256 "$asset_path" | /usr/bin/awk '{print $1}')"
              published_digest="$(print -r -- "$release_json" | /usr/bin/jq -r \
                --arg name "$asset_name" '.assets[] | select(.name == $name) | .digest')"
              [[ "$published_digest" == "sha256:$local_digest" ]] || {
                print -u2 -- "Existing release digest does not match $asset_name."
                exit 1
              }
            done
            scripts/verify-dmg.sh "$existing_dmg" \
              --app-name Onyx.app \
              --bundle-id app.onyx.agent \
              --version "$VERSION" \
              --source-revision "$SOURCE_SHA" \
              --require-universal
          else
            for asset_path in "$dmg_path" "$checksum_path"; do
              asset_name="${asset_path:t}"
              local_digest="$(/usr/bin/shasum -a 256 "$asset_path" | /usr/bin/awk '{print $1}')"
              published_digest="$(print -r -- "$release_json" | /usr/bin/jq -r \
                --arg name "$asset_name" '.assets[] | select(.name == $name) | .digest')"
              [[ "$published_digest" == "sha256:$local_digest" ]] || {
                print -u2 -- "Published digest does not match $asset_name."
                exit 1
              }
            done
          fi

          tag_commit="$(resolve_tag_commit "$TAG" || true)"
          [[ "$tag_commit" == "$SOURCE_SHA" ]] || {
            print -u2 -- "Published tag does not point at source commit $SOURCE_SHA."
            exit 1
          }
          release_url="$(print -r -- "$release_json" | /usr/bin/jq -r '.url')"
          {
            print -- "## Onyx $VERSION is published"
            print
            print -- "Public release: $release_url"
            print -- "DMG: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG/$ARTIFACT_NAME.dmg"
            print -- "Checksum: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG/$ARTIFACT_NAME.dmg.sha256"
            print -- "Source commit: $SOURCE_SHA"
            print -- "Distribution: ad-hoc signed app in an unsigned development DMG"
          } >> "$GITHUB_STEP_SUMMARY"
