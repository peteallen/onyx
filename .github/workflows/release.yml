name: Release
run-name: Onyx ${{ inputs.version || github.ref_name }} public DMG

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, with or without a leading v (for example, 0.1.0)"
        required: true
        type: string

# Public releases are deliberately ad-hoc development builds. No Apple
# signing key or notarization credential is exposed to this workflow.
permissions:
  contents: write

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release DMG
    runs-on: macos-15
    timeout-minutes: 70
    env:
      CLANG_MODULE_CACHE_PATH: ${{ github.workspace }}/.build/module-cache
      SWIFTPM_MODULECACHE_OVERRIDE: ${{ github.workspace }}/.build/swiftpm-module-cache

    steps:
      - name: Check out immutable source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify release automation contract
        shell: zsh -euo pipefail {0}
        run: scripts/check-release-automation.sh

      - name: Select compatible Xcode
        shell: zsh -euo pipefail {0}
        run: |
          developer_candidates=("$(/usr/bin/xcode-select -p)")
          xcode_apps=(/Applications/Xcode_*.app(NOn))
          for (( index=${#xcode_apps[@]}; index >= 1; index-- )); do
            developer_candidates+=("${xcode_apps[index]}/Contents/Developer")
          done

          selected_xcode=""
          for candidate in "${developer_candidates[@]}"; do
            export DEVELOPER_DIR="$candidate"
            if /usr/bin/swift package --disable-sandbox dump-package >/dev/null 2>&1; then
              selected_xcode="$candidate"
              break
            fi
          done
          if [[ -z "$selected_xcode" ]]; then
            print -u2 -- "The runner image does not contain Xcode 26 / Swift 6.2 or newer."
            exit 1
          fi
          echo "DEVELOPER_DIR=$selected_xcode" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$selected_xcode"
          /usr/bin/xcodebuild -version
          /usr/bin/swift --version

      - name: Resolve and lock release source
        id: metadata
        shell: zsh -euo pipefail {0}
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            tag="$GITHUB_REF_NAME"
            version="${tag#v}"
            [[ "$tag" == v[0-9]*.[0-9]*.[0-9]* ]] || {
              print -u2 -- "Tag must be vX.Y.Z: $tag"
              exit 1
            }
            tag_commit="$(/usr/bin/git rev-parse "$tag^{commit}")"
            [[ "$tag_commit" == "$SOURCE_SHA" ]] || {
              print -u2 -- "Tag $tag does not point at $SOURCE_SHA (found $tag_commit)."
              exit 1
            }
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              print -u2 -- "Release already exists and will not be replaced: $tag"
              exit 1
            fi
          else
            [[ "$SOURCE_REF" == "refs/heads/$DEFAULT_BRANCH" ]] || {
              print -u2 -- "Manual releases must run from $DEFAULT_BRANCH."
              exit 1
            }
            version="${REQUESTED_VERSION#v}"
            [[ "$version" =~ '^[0-9]+[.][0-9]+[.][0-9]+$' ]] || {
              print -u2 -- "Release version must be numeric x.y.z: $version"
              exit 1
            }
            main_sha="$(/usr/bin/git ls-remote origin "refs/heads/$DEFAULT_BRANCH" | /usr/bin/awk '{print $1}')"
            [[ -n "$main_sha" && "$main_sha" == "$SOURCE_SHA" ]] || {
              print -u2 -- "The checked-out commit is not the current $DEFAULT_BRANCH head."
              exit 1
            }
            tag="v$version"
            if /usr/bin/git ls-remote --exit-code origin "refs/tags/$tag" >/dev/null 2>&1; then
              print -u2 -- "Release tag already exists and will not be moved: $tag"
              exit 1
            fi
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              print -u2 -- "Release already exists and will not be replaced: $tag"
              exit 1
            fi
          fi

          declared_version="$(/usr/bin/plutil -extract CFBundleShortVersionString raw -o - support/Info.plist)"
          [[ "$version" == "$declared_version" ]] || {
            print -u2 -- "Release $version does not match support/Info.plist ($declared_version)."
            exit 1
          }
          checked_out_sha="$(/usr/bin/git rev-parse HEAD)"
          [[ "$checked_out_sha" == "$SOURCE_SHA" ]] || {
            print -u2 -- "Checked-out source does not match the immutable workflow commit."
            exit 1
          }

          artifact_name="Onyx-$version-macOS"
          print "version=$version" >> "$GITHUB_OUTPUT"
          print "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          print "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        shell: zsh -euo pipefail {0}
        run: /usr/bin/swift test --disable-sandbox

      - name: Restore pinned Codex runtime archives
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: .artifacts/codex-runtime
          key: codex-runtime-${{ runner.os }}-${{ hashFiles('support/codex-runtime-manifest.json') }}

      - name: Fetch and verify pinned Codex runtime archives
        shell: zsh -euo pipefail {0}
        run: scripts/fetch-codex-runtime.sh --architectures universal

      - name: Build and verify ad-hoc release artifacts
        shell: zsh -euo pipefail {0}
        run: |
          release_dir="$RUNNER_TEMP/onyx-release"
          scripts/release.sh "${{ steps.metadata.outputs.version }}" "$release_dir" \
            --build-number "$GITHUB_RUN_NUMBER" \
            --display-name Onyx \
            --bundle-id app.onyx.agent \
            --architectures universal \
            --signing-identity - \
            --no-notarize
          (
            cd "$release_dir"
            /usr/bin/shasum -a 256 -c \
              "${{ steps.metadata.outputs.artifact_name }}.dmg.sha256"
          )

      - name: Create and verify public GitHub Release
        shell: zsh -euo pipefail {0}
        env:
          ARTIFACT_NAME: ${{ steps.metadata.outputs.artifact_name }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          TAG: ${{ steps.metadata.outputs.tag }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          release_dir="$RUNNER_TEMP/onyx-release"
          dmg_path="$release_dir/$ARTIFACT_NAME.dmg"
          checksum_path="$release_dir/$ARTIFACT_NAME.dmg.sha256"
          [[ -f "$dmg_path" && -f "$checksum_path" ]] || {
            print -u2 -- "Release DMG/checksum pair is incomplete."
            exit 1
          }

          notes_file="$RUNNER_TEMP/onyx-release-notes.md"
          {
            print -- "Onyx $VERSION for macOS 15 or newer."
            print
            print -- "Download the universal DMG for Apple Silicon or Intel Macs, together with its SHA-256 checksum."
            print
            print -- "**Development distribution:** the app is ad-hoc signed and the DMG is not notarized. macOS will show the normal unidentified-developer warning."
            print
            print -- "Source commit: [$SOURCE_SHA]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$SOURCE_SHA)"
          } > "$notes_file"

          release_arguments=(
            "$TAG"
            "$dmg_path"
            "$checksum_path"
            --repo "$GITHUB_REPOSITORY"
            --title "Onyx $VERSION (development build)"
            --notes-file "$notes_file"
            --latest
            --fail-on-no-commits
          )
          if [[ "$EVENT_NAME" == "push" ]]; then
            release_arguments+=(--verify-tag)
          else
            release_arguments+=(--target "$SOURCE_SHA")
          fi
          gh release create "${release_arguments[@]}"

          release_json="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,assets,url)"
          [[ "$(print -r -- "$release_json" | /usr/bin/jq -r '.tagName')" == "$TAG" ]] || exit 1
          [[ "$(print -r -- "$release_json" | /usr/bin/jq -r '.isDraft')" == "false" ]] || exit 1
          [[ "$(print -r -- "$release_json" | /usr/bin/jq -r '.isPrerelease')" == "false" ]] || exit 1
          latest_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')"
          [[ "$latest_tag" == "$TAG" ]] || {
            print -u2 -- "Published release was not selected as latest."
            exit 1
          }
          asset_count="$(print -r -- "$release_json" | /usr/bin/jq '.assets | length')"
          [[ "$asset_count" == "2" ]] || {
            print -u2 -- "Release must contain exactly two assets."
            exit 1
          }
          print -r -- "$release_json" | /usr/bin/jq -e \
            --arg dmg "$ARTIFACT_NAME.dmg" \
            --arg checksum "$ARTIFACT_NAME.dmg.sha256" \
            '([.assets[].name] | sort) == ([$dmg, $checksum] | sort)' >/dev/null

          for asset_path in "$dmg_path" "$checksum_path"; do
            asset_name="${asset_path:t}"
            local_digest="$(/usr/bin/shasum -a 256 "$asset_path" | /usr/bin/awk '{print $1}')"
            published_digest="$(print -r -- "$release_json" | /usr/bin/jq -r \
              --arg name "$asset_name" '.assets[] | select(.name == $name) | .digest')"
            [[ "$published_digest" == "sha256:$local_digest" ]] || {
              print -u2 -- "Published digest does not match $asset_name."
              exit 1
            }
          done

          tag_commit="$(/usr/bin/git ls-remote origin "refs/tags/$TAG^{}" | /usr/bin/awk '{print $1}')"
          if [[ -z "$tag_commit" ]]; then
            tag_commit="$(/usr/bin/git ls-remote origin "refs/tags/$TAG" | /usr/bin/awk '{print $1}')"
          fi
          [[ "$tag_commit" == "$SOURCE_SHA" ]] || {
            print -u2 -- "Published tag does not point at source commit $SOURCE_SHA."
            exit 1
          }
          release_url="$(print -r -- "$release_json" | /usr/bin/jq -r '.url')"
          {
            print -- "## Onyx $VERSION is published"
            print
            print -- "Public release: $release_url"
            print -- "DMG: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG/$ARTIFACT_NAME.dmg"
            print -- "Checksum: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG/$ARTIFACT_NAME.dmg.sha256"
            print -- "Source commit: $SOURCE_SHA"
            print -- "Distribution: ad-hoc signed app in an unsigned development DMG"
          } >> "$GITHUB_STEP_SUMMARY"
